<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6C5CE7">
<title>Finanza — Control de gastos compartido</title>
<meta name="description" content="Registra ingresos, egresos, cobros, pagos y metas de ahorro, y compártelo con tu pareja.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">

  <!-- ============ ONBOARDING ============ -->
  <section id="view-setup" class="setup-screen">
    <div class="setup-card">

      <!-- Paso 1: nombre -->
      <div class="setup-step" id="step-name" data-step="name">
        <div class="setup-icon">
          <svg viewBox="0 0 24 24" fill="none" width="26" height="26"><path d="M16 14c2.67 0 8 1.34 8 4v2H0v-2c0-2.66 5.33-4 8-4 .32 0 .69.02 1.08.05M8 12A5 5 0 1 0 8 2a5 5 0 0 0 0 10Zm8-2a4 4 0 1 0-1.2-7.82" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h1>¿Cómo te llamas?</h1>
        <p class="setup-sub">Tu nombre aparecerá en cada registro que hagas</p>
        <input type="text" id="input-name" class="input" placeholder="Tu nombre" maxlength="24" autocomplete="given-name">
        <button class="btn btn-primary" id="btn-name-continue" disabled>Continuar</button>
      </div>

      <!-- Paso 2: crear o unirse -->
      <div class="setup-step" id="step-account" data-step="account" hidden>
        <div class="setup-icon">
          <svg viewBox="0 0 24 24" fill="none" width="26" height="26"><path d="M16 14c2.67 0 8 1.34 8 4v2H0v-2c0-2.66 5.33-4 8-4 .32 0 .69.02 1.08.05M8 12A5 5 0 1 0 8 2a5 5 0 0 0 0 10Zm8-2a4 4 0 1 0-1.2-7.82" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h1>Hola, <span id="greet-name"></span> <span class="wave">👋</span></h1>
        <p class="setup-sub">¿Crear cuenta nueva o unirte a una existente?</p>
        <button class="btn btn-primary" id="btn-create-account">Crear cuenta nueva</button>
        <button class="btn btn-secondary" id="btn-join-account">Unirme a una cuenta</button>
        <button class="btn-link" id="btn-back-name">← Cambiar nombre</button>

        <div class="join-panel" id="join-panel" hidden>
          <input type="text" id="input-code" class="input input-code" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off">
          <button class="btn btn-primary" id="btn-join-confirm">Unirme</button>
          <p class="field-error" id="join-error" hidden>No encontramos esa cuenta en este dispositivo.</p>
        </div>
      </div>

    </div>
  </section>

  <!-- ============ APP PRINCIPAL ============ -->
  <div id="view-main" hidden>

    <!-- Sidebar de escritorio -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">💰</div>
        <span>Finanza</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <button class="sidebar-account" id="sidebar-account-btn">
        <span class="avatar" id="sidebar-avatar"></span>
        <span id="sidebar-username"></span>
      </button>
    </aside>

    <div class="main-col">
      <main id="main-content" class="main-content"></main>
      <nav class="bottom-nav" id="bottom-nav"></nav>
    </div>
  </div>

  <!-- ============ MODAL GENÉRICO ============ -->
  <div id="modal-root"></div>

  <!-- ============ REPORTE IMPRIMIBLE (oculto, solo para PDF) ============ -->
  <div id="print-report" class="print-only"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script src="js/storage.js"></script>
<script src="js/modals.js"></script>
<script src="js/views/setup.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/receivables.js"></script>
<script src="js/views/payables.js"></script>
<script src="js/views/report.js"></script>
<script src="js/views/savings.js"></script>
<script src="js/views/account.js"></script>
<script src="js/app.js"></script>
</body>
</html>
